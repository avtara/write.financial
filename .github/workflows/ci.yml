# SPDX-License-Identifier: AGPL-3.0-only
# Two lanes (CONTRIBUTING.md › CI lanes). `changes` picks the lane and the data paths; `CI gate` is the one required check.
# - fast (every pull request push): static checks, unit tests of the changed code (no coverage gate), E2E core
#   (projects m0, tablet, app), gitleaks, DCO; plus the data lane — integration tests and the backup restore — when the
#   diff touches the database, worker, server functions, auth, crypto, or deploy files.
# - full (push to main, workflow_dispatch, or a pull request labelled `full-ci`, used on the pull request that closes a
#   phase): everything — unit tests with the 100% per-file coverage gate (D27), mutation tests (incremental), integration,
#   every E2E project, the Docker image boot with the install proof, and the backup restore. The jobs run in parallel.
#   On main the run is informational (nothing waits for it); a red run there is fixed in the next pull request.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push or label change supersedes the pull request's running CI; every push to main is checked to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Lane and changed paths
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.lane.outputs.mode }}
      data: ${{ steps.lane.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: lane
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$FULL_LABEL" = true ]; then mode=full; else mode=fast; fi
          data=true
          if [ "$EVENT" = pull_request ]; then
            # The pull request's own changes: the diff from the merge base with its base branch.
            changed="$(git diff --name-only "$BASE...$HEAD")"
            echo "$changed"
            echo "$changed" | grep -qE '^(packages/(db|auth|crypto)/|apps/worker/|apps/web/src/server/|deploy/)' || data=false
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "data=$data" >> "$GITHUB_OUTPUT"
          echo "Lane: **$mode**, data lane (integration + backup restore): **$data**" | tee -a "$GITHUB_STEP_SUMMARY"

  static:
    name: Lint, format, typecheck, repo checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:spdx
      - run: pnpm check:test-files
      - run: pnpm check:tokens
      - run: pnpm check:i18n
      - run: pnpm check:migrations

  unit:
    name: ${{ needs.changes.outputs.mode == 'full' && 'Unit tests (100% per-file coverage, D27)' || 'Unit tests (changed code)' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The fast lane compares with the base branch (`vitest --changed`).
          fetch-depth: ${{ needs.changes.outputs.mode == 'full' && 1 || 0 }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Receipt OCR (FR-T7) rasterizes PDFs with poppler's pdftoppm/pdfinfo — a runtime dependency
      # (the image ships it), so the unit tests prove the real pipeline and need it too.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      # Component tests (*.test.tsx) run in Vitest browser mode on headless Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Unit tests with the coverage gate
        if: needs.changes.outputs.mode == 'full'
        run: pnpm test:unit
      # Tests related to the files the pull request changes (module graph), every test when a config or package.json
      # changed. The D14 architecture test is a unit test, so it runs whenever worker code changes.
      - name: Unit tests of the changed code
        if: needs.changes.outputs.mode == 'fast'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec vitest run --project unit --project unit-browser --changed "origin/$BASE_REF" --passWithNoTests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.changes.outputs.mode == 'full'
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  mutation:
    name: Mutation tests (domain + crypto, ≥ 90%)
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stryker's incremental file, per base branch and per set of tests: reuse needs identical tests, so a pull request
      # that changes a domain/crypto test, the mutation config, or the lockfile tests every mutant again. Pull requests
      # restore their own latest file, else main's.
      - name: Restore the incremental mutation results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.base_ref || github.ref_name }}-${{ hashFiles('packages/domain/src/**/*.test.ts', 'packages/crypto/src/**/*.test.ts', 'stryker.config.json', 'vitest.mutation.config.ts', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: stryker-incremental-${{ github.base_ref || github.ref_name }}-${{ hashFiles('packages/domain/src/**/*.test.ts', 'packages/crypto/src/**/*.test.ts', 'stryker.config.json', 'vitest.mutation.config.ts', 'pnpm-lock.yaml') }}-
      # Pull requests re-test only the mutants in changed files. Main re-tests every mutant (`--force`), so a change that
      # flips a mutant in an unchanged file is caught there, and the file it writes is the pull requests' baseline.
      - name: Mutation tests
        run: pnpm test:mutation --incremental ${{ github.event_name != 'pull_request' && '--force' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  integration:
    name: Integration tests (Testcontainers)
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.data == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: ${{ needs.changes.outputs.mode == 'full' && 'E2E smoke (Playwright)' || 'E2E core (Playwright m0, tablet, app)' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # PostgreSQL 18.6, Valkey 9.2, SeaweedFS, and Mailpit from deploy/dev/compose.yaml (the same stack as local
      # development); e2e/prepare.ts creates the `wf_e2e` database, roles, and migrations before the server starts.
      - name: Start the dev services
        run: pnpm dev:up
      # Against the production build: `node .output/server/index.mjs`, started by Playwright's webServer.
      - run: pnpm --filter @wf/web build
      - name: Every E2E project
        if: needs.changes.outputs.mode == 'full'
        run: pnpm --filter @wf/web test:e2e
      - name: E2E core (setup, 2FA, tablet, app shell)
        if: needs.changes.outputs.mode == 'fast'
        run: pnpm --filter @wf/web test:e2e --project m0 --project tablet --project app
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/dev/compose.yaml logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces
          path: reports/e2e/
          retention-days: 14

  docker:
    name: Docker image (build + boot)
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node, pnpm, and Chromium for the install proof's Playwright spec (installed before the clock starts).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: write-financial:ci
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=docker-ci
          cache-to: type=gha,mode=max,scope=docker-ci
      - name: Image size
        run: docker image inspect write-financial:ci --format 'linux/amd64 {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
      # The self-host compose file as shipped, in localhost mode (Caddy's local CA), on clean volumes.
      - name: Boot the self-host stack
        working-directory: deploy/compose
        run: |
          umask 077
          {
            echo WF_IMAGE=write-financial
            echo WF_VERSION=ci
            echo WF_DOMAIN=localhost
            echo PUBLIC_URL=https://localhost
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 32)"
          } > .env
          # The install proof's clock: from `docker compose up` to the admin's sign-in with 2FA (≤ 15 minutes).
          echo "WF_START=$(date +%s)" >> "$GITHUB_ENV"
          docker compose up -d --wait --wait-timeout 300
      - name: Web answers through Caddy, worker is healthy, init exited 0, only Caddy publishes ports
        working-directory: deploy/compose
        run: |
          set -x
          test "$(curl -fsSk https://localhost/healthz)" = '{"status":"ok"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/healthz)" = 308
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q worker)")" = healthy
          test "$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$(docker compose ps -a -q init)")" = 'exited 0'
          # Setup is pending on a fresh instance, so init printed the setup URL (grep -q keeps the token out of the log).
          docker compose logs init | grep -q 'https://localhost/setup?token='
          published="$(docker compose ps -a --format json | jq -rs '[.[] | select([.Publishers[]? | select(.PublishedPort > 0)] | length > 0) | .Service] | unique | join(",")')"
          test "$published" = caddy
      # The token is masked before anything else sees it, and only travels through the job environment.
      - name: Read the setup token
        working-directory: deploy/compose
        run: |
          token="$(docker compose logs --no-color --no-log-prefix init | grep -o 'https://localhost/setup?token=[^[:space:]]*' | tail -n 1 | cut -d= -f2-)"
          echo "::add-mask::$token"
          test -n "$token"
          echo "WF_SELFHOST_SETUP_TOKEN=$token" >> "$GITHUB_ENV"
      # M0 exit (plan §8): setup wizard → admin with TOTP → sign-in with 2FA, in Chromium through Caddy.
      - name: Install proof (setup wizard → admin login + 2FA in ≤ 15 minutes)
        env:
          WF_SELFHOST_URL: https://localhost
        run: |
          pnpm --filter @wf/web test:e2e:selfhost
          elapsed=$(( $(date +%s) - WF_START ))
          echo "Install proof: \`docker compose up\` → setup wizard → admin login + 2FA in ${elapsed} s (limit 900 s)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -le 900
      - name: Second start reuses the secrets
        working-directory: deploy/compose
        run: |
          digest() { docker compose exec -T web sh -c 'find /run/wf-secrets -type f | sort | xargs cat | sha256sum'; }
          before="$(digest)"
          docker compose up -d --wait --wait-timeout 300
          test "$(digest)" = "$before"
          docker compose logs init | grep -q 'Secrets: using the existing ones'
          # The completed setup survives the restart: the wizard stays closed and the sign-in page answers.
          test "$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost/setup?token=$WF_SELFHOST_SETUP_TOKEN")" = 404
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/sign-in)" = 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-selfhost-traces
          path: reports/e2e-selfhost/
          retention-days: 14
      - name: Logs
        if: failure()
        working-directory: deploy/compose
        # Redacted too: a failure before "Read the setup token" would otherwise print the unmasked token.
        run: docker compose logs --no-color | sed 's/setup?token=[^[:space:]]*/setup?token=[redacted]/'
      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  backup-restore:
    name: Backup restore (compose)
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.data == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The proof's seed/verify script runs from this checkout (docs in deploy/ci/backup-restore.sh).
      - run: pnpm install --frozen-lockfile
      # The reference age CLI decrypts the archive in the proof, and age-keygen makes its throwaway key pair.
      - name: Install age
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends age
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: write-financial:ci
          build-args: REVISION=${{ github.sha }}
          # Reads the cache of the "Docker image (build + boot)" job, which writes it.
          cache-from: type=gha,scope=docker-ci
      # Backup, no plaintext in the archive, delete every volume, restore onto a new stack, verify user, DEK, object.
      - name: Backup → restore on the self-host stack
        run: deploy/ci/backup-restore.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by matching its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qxF "Signed-off-by: $author"; then
              echo "::error::Commit $sha is missing 'Signed-off-by: $author' (use git commit -s)"
              status=1
            fi
          done
          exit $status

  # The one required check (branch protection). Green when every job of the run's lane succeeded: the fast lane (+ the
  # data lane when it applies) or, with `full-ci`, the full lane. DCO runs only on pull requests.
  gate:
    name: CI gate
    if: always()
    needs: [changes, static, unit, mutation, integration, e2e, docker, backup-restore, secrets, dco]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job of the lane succeeded
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          DATA: ${{ needs.changes.outputs.data }}
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          required='changes static unit e2e secrets'
          if [ "$EVENT" = pull_request ]; then required="$required dco"; fi
          if [ "$MODE" = full ]; then
            required="$required mutation integration docker backup-restore"
            lane='full lane'
          elif [ "$DATA" = true ]; then
            required="$required integration backup-restore"
            lane='fast lane + data lane'
          else
            lane='fast lane'
          fi
          # Every failed or cancelled job, and every required job that did not succeed (e.g. skipped).
          failed="$(jq -r --arg required "$required" '($required | split(" ")) as $r
            | [to_entries[] | select(.value.result == "failure" or .value.result == "cancelled"
                or (.key as $k | $r | index($k)) and .value.result != "success")
              | "\(.key) (\(.value.result))"] | join(", ")' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error title=CI gate::failed jobs: $failed"
            echo "### CI gate: failed jobs: $failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### CI gate: $lane green" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" != full ]; then
            echo "The 100% coverage gate, mutation tests, every E2E project, and the Docker boot run with the full-ci label (the pull request that closes a phase) and on main." >> "$GITHUB_STEP_SUMMARY"
          fi
