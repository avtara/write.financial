# SPDX-License-Identifier: AGPL-3.0-only
# CI order (implementation plan §9.3): static checks → unit tests (100% gate, D27) → mutation → … → build.
# Integration, E2E, and build jobs are added in M0 once the apps exist.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, format, typecheck, repo checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:spdx
      - run: pnpm check:test-files
      - run: pnpm check:tokens
      - run: pnpm check:i18n

  unit:
    name: Unit tests (100% per-file coverage, D27)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Component tests (*.test.tsx) run in Vitest browser mode on headless Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  mutation:
    name: Mutation tests (domain + crypto, ≥ 90%)
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  integration:
    name: Integration tests (Testcontainers)
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: E2E smoke (Playwright)
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # PostgreSQL 18.6, Valkey 9.2, SeaweedFS, and Mailpit from deploy/dev/compose.yaml (the same stack as local
      # development); e2e/prepare.ts creates the `wf_e2e` database, roles, and migrations before the server starts.
      - name: Start the dev services
        run: pnpm dev:up
      # Against the production build: `node .output/server/index.mjs`, started by Playwright's webServer.
      - run: pnpm --filter @wf/web build
      - run: pnpm --filter @wf/web test:e2e
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/dev/compose.yaml logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces
          path: reports/e2e/
          retention-days: 14

  docker:
    name: Docker image (build + boot)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: write-financial:ci
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=docker-ci
          cache-to: type=gha,mode=max,scope=docker-ci
      - name: Image size
        run: docker image inspect write-financial:ci --format 'linux/amd64 {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
      # The self-host compose file as shipped, in localhost mode (Caddy's local CA), on clean volumes.
      - name: Boot the self-host stack
        working-directory: deploy/compose
        run: |
          umask 077
          {
            echo WF_IMAGE=write-financial
            echo WF_VERSION=ci
            echo WF_DOMAIN=localhost
            echo PUBLIC_URL=https://localhost
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 32)"
          } > .env
          docker compose up -d --wait --wait-timeout 300
      - name: Web answers through Caddy, worker is healthy, init exited 0, only Caddy publishes ports
        working-directory: deploy/compose
        run: |
          set -x
          test "$(curl -fsSk https://localhost/healthz)" = '{"status":"ok"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/healthz)" = 308
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q worker)")" = healthy
          test "$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$(docker compose ps -a -q init)")" = 'exited 0'
          # Setup is pending on a fresh instance, so init printed the setup URL (grep -q keeps the token out of the log).
          docker compose logs init | grep -q 'https://localhost/setup?token='
          published="$(docker compose ps -a --format json | jq -rs '[.[] | select([.Publishers[]? | select(.PublishedPort > 0)] | length > 0) | .Service] | unique | join(",")')"
          test "$published" = caddy
      - name: Second start reuses the secrets
        working-directory: deploy/compose
        run: |
          digest() { docker compose exec -T web sh -c 'find /run/wf-secrets -type f | sort | xargs cat | sha256sum'; }
          before="$(digest)"
          docker compose up -d --wait --wait-timeout 300
          test "$(digest)" = "$before"
          docker compose logs init | grep -q 'Secrets: using the existing ones'
      - name: Logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by matching its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qxF "Signed-off-by: $author"; then
              echo "::error::Commit $sha is missing 'Signed-off-by: $author' (use git commit -s)"
              status=1
            fi
          done
          exit $status
